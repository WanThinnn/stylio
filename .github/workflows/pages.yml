name: Deploy browser build to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer run supersedes an older one. Letting both finish means whichever
# finishes LAST wins, which is not necessarily the newest commit: re-running an
# old run replays that old commit, and it can land after a newer push and quietly
# put the site back. Cancelling is safe here because the site is static, so there
# is no half-finished state to protect.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Assemble and verify large AI Styles models
        run: node tools/package-ai-style-models.mjs assemble --remove-parts

      - name: Download pinned AI Portrait assets
        run: node tools/download-ai-portrait.mjs

      - name: Download pinned AI Portrait foreground matte
        run: node tools/download-foreground-matte.mjs

      # The site is static: no build step, nothing to install. Guard instead
      # against publishing a personal photo, omitting a donor profile, or
      # shipping stale PWA metadata/offline asset paths.
      # The parentheses matter: without them -print binds to the last -iname only.
      - name: Check the site contains no photos
        run: |
          found=$(find web \( -iname '*.heic' -o -iname '*.heif' \) -print)
          if [ -n "$found" ]; then
            echo "::error::web/ contains photo files; they must not be published"
            echo "$found"
            exit 1
          fi

      - name: Check the donor profiles are present
        run: |
          for f in web/profiles/index.json web/profiles/48-12.zip web/profiles/45-15.zip; do
            test -s "$f" || { echo "::error::missing $f"; exit 1; }
          done

      - name: Check the PWA is internally consistent
        run: node tests/web/check-pwa.mjs

      - name: Check version and release notes match their editable sources
        run: |
          node tools/sync-release-info.mjs --check
          node --test tests/web/release-notes.mjs

      - name: Check browser module and worker paths
        run: node --test tests/web/module-paths.mjs

      - name: Check application wiring and session cleanup
        run: node --test tests/web/application.mjs tests/web/app-shell.mjs tests/web/stylesheets.mjs

      - name: Check static release asset versioning
        run: node --test tests/web/web-release.mjs

      - name: Check edited native Styles and original-photo preservation
        run: node --test tests/web/native-export-texture.mjs tests/web/native-rebuild-hdr.mjs tests/web/native-style-rebuild.mjs tests/web/hdr-linear-thumbnail.mjs tests/web/heic-grid-sample.mjs

      - name: Check editable RGB HDR colour reconstruction
        run: node --test tests/web/hdr-scalar-export.mjs

      - name: Check AI Styles, Portrait export, and photo preservation before publishing
        run: node --test tests/web/ai-portrait-source.mjs tests/web/portrait-controller.mjs

      - name: Check Portrait matte guidance and depth fusion
        run: node --test tests/web/foreground-matte.mjs tests/web/subject-matte.mjs tests/web/subject-depth-guidance.mjs tests/web/portrait-orchestration.mjs tests/web/portrait-scene-response.mjs

      - name: Check AI feature and photo export regressions
        run: node --test tests/web/ai-feature-controls.mjs tests/web/ai-style-orchestration.mjs tests/web/style-analysis.mjs tests/web/style-inference.mjs tests/web/style-model.mjs tests/web/style-quality.mjs tests/web/style-semantic-axes.mjs tests/web/style-scene-decision.mjs tests/web/style-recommender.mjs tests/web/style-display-render.mjs tests/web/style-reference-bank.mjs tests/web/style-selection.mjs tests/web/ai-portrait-export.mjs tests/web/portrait-geometry.mjs tests/web/depth-refinement.mjs tests/web/ai-portrait.mjs tests/web/native-base-analysis.mjs tests/web/apple-depth.mjs tests/web/jpeg-hdr.mjs tests/web/heic-worker.mjs tests/web/raster-import.mjs tests/web/lifecycle.mjs tests/web/style-preservation.mjs tests/web/texture-compatibility.mjs

      # enablement turns Pages on if it is not already, so a fresh clone of this
      # repo deploys without anyone visiting the settings page first.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build a static release with versioned asset URLs
        run: node tools/build-web-release.mjs "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .stylio-site
      - id: deploy
        uses: actions/deploy-pages@v4
