name: Browser regression checks
on:
  push:
    paths: ['web/**', 'tests/web/**', 'tools/**', '.github/workflows/web-checks.yml']
  pull_request:
    paths: ['web/**', 'tests/web/**', 'tools/**', '.github/workflows/web-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/package-ai-style-models.mjs assemble
      - run: node tests/web/check-i18n.mjs
      - run: node tests/web/check-pwa.mjs
      - name: Check Portrait source decoding and retry lifecycle
        run: node --test tests/web/ai-portrait-source.mjs tests/web/portrait-controller.mjs
      - name: Check edited native Styles and original-photo preservation
        run: node --test tests/web/native-export-texture.mjs tests/web/native-rebuild-hdr.mjs tests/web/native-style-rebuild.mjs tests/web/hdr-linear-thumbnail.mjs tests/web/heic-grid-sample.mjs

      - name: Check editable RGB HDR colour reconstruction
        run: node --test tests/web/hdr-scalar-export.mjs
      - run: node --test tests/web/application.mjs tests/web/app-shell.mjs tests/web/stylesheets.mjs
      - run: node --test tests/web/module-paths.mjs
      - run: node --test tests/web/web-release.mjs
      - run: node --test tests/web/depth-refinement.mjs tests/web/subject-depth-guidance.mjs tests/web/portrait-geometry.mjs tests/web/native-base-analysis.mjs
      - run: node --test tests/web/ai-feature-controls.mjs tests/web/ai-style-orchestration.mjs tests/web/style-analysis.mjs tests/web/style-inference.mjs tests/web/style-model.mjs tests/web/style-quality.mjs tests/web/style-semantic-axes.mjs tests/web/style-scene-decision.mjs tests/web/style-recommender.mjs tests/web/style-display-render.mjs tests/web/style-reference-bank.mjs tests/web/style-selection.mjs tests/web/detail-inference.mjs tests/web/detail-processing.mjs tests/web/detail-native-heic.mjs tests/web/startup.mjs tests/web/lifecycle.mjs tests/web/ai-portrait.mjs tests/web/ai-portrait-export.mjs tests/web/apple-depth.mjs tests/web/heic-worker.mjs tests/web/style-preservation.mjs tests/web/texture-compatibility.mjs tests/web/soft-skin.mjs tests/web/face-refinement.mjs tests/web/raster-import.mjs tests/web/jpeg-hdr.mjs tests/web/dng-import.mjs tests/web/language.mjs tests/web/photo-date.mjs tests/web/live-photo.mjs tests/web/thumbnail-graph.mjs
