[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stylio-adaptive-styles-research"
version = "0.1.0"
description = "Dataset preparation and notebook experiments for Stylio Adaptive Styles"
requires-python = ">=3.10"
dependencies = [
  "jupyterlab>=4,<5",
  "ipykernel>=6,<8",
  "numpy>=1.26,<2",
  "pandas>=2.2,<3",
  "Pillow>=10.4,<13",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
train = [
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "transformers>=4.40,<5",
  "onnx>=1.15,<2",
  "onnxruntime>=1.17,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
